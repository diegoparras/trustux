name: Publicar imagen Docker (GHCR)

# Publica ghcr.io/<owner>/trustux automaticamente:
#  - push a main           -> :latest + :X.Y.Z + :sha (base) y  :latest-full + :X.Y.Z-full + :sha-...-full (full),
#                             y el Release vX.Y.Z con las notas de esa version del CHANGELOG.md
#  - tag vX.Y.Z (release)  -> :X.Y.Z + :X.Y          (base)   y  :X.Y.Z-full + :X.Y-full     (full)
# Cada version dice que cambia: sin su seccion en el CHANGELOG el build no sale.
# Usa el GITHUB_TOKEN del runner (ya trae packages: write): sin tokens manuales.
#
# Dos variantes (matrix):
#  - base (Dockerfile)      -> liviana, Tiers 1-2 de goodunluck. Multi-arch (amd64 + arm64).
#  - full (Dockerfile.full) -> suma el Tier 3 nativo (John jumbo, hashcat, bkcrack, qpdf, 7z).
#                              Compila del fuente -> solo amd64 (arm64 emulado tardaria demasiado).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # crear el tag y el Release de la version
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - dockerfile: Dockerfile.full
            suffix: "-full"
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Version y novedades (CHANGELOG)
        id: ver
        run: |
          V="$(node server/notas-version.js --version)"
          node server/notas-version.js > "$RUNNER_TEMP/notas.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## Trustux v$V${{ matrix.suffix }}"
            echo
            cat "$RUNNER_TEMP/notas.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/trustux
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build y push (${{ matrix.dockerfile }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

  # Release vX.Y.Z con las notas del CHANGELOG, una sola vez y solo si las dos imagenes salieron.
  release:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Release de la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node server/notas-version.js --version)"
          node server/notas-version.js > "$RUNNER_TEMP/notas.md"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La v$V ya estaba publicada: este deploy no subio la version (patch) ni sumo novedades."
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Trustux v$V" --notes-file "$RUNNER_TEMP/notas.md"
          fi
