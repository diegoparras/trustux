name: Publicar imagen Docker (GHCR)

# Publica ghcr.io/<owner>/trustux automaticamente:
#  - push a main           -> :latest + :sha        (base)   y  :latest-full + :sha-...-full (full)
#  - tag vX.Y.Z (release)  -> :X.Y.Z + :X.Y          (base)   y  :X.Y.Z-full + :X.Y-full     (full)
# Usa el GITHUB_TOKEN del runner (ya trae packages: write): sin tokens manuales.
#
# Dos variantes (matrix):
#  - base (Dockerfile)      -> liviana, Tiers 1-2 de goodunluck. Multi-arch (amd64 + arm64).
#  - full (Dockerfile.full) -> suma el Tier 3 nativo (John jumbo, hashcat, bkcrack, qpdf, 7z).
#                              Compila del fuente -> solo amd64 (arm64 emulado tardaria demasiado).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ""
            platforms: linux/amd64,linux/arm64
          - dockerfile: Dockerfile.full
            suffix: "-full"
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trustux
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push (${{ matrix.dockerfile }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
